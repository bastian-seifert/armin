name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: Build engine + hook (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: armin-engine-linux-x64
            platform: linux-x64
          - target: x86_64-apple-darwin
            os: macos-14        # x64 is cross-compiled on the arm64 runner
                                # (the macos-13 runner tier was retired)
            archive: armin-engine-macos-x64
            platform: macos-x64
          - target: aarch64-apple-darwin
            os: macos-14
            archive: armin-engine-macos-arm64
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: armin-core
      - name: build engine
        working-directory: armin-core
        run: cargo build --release -p armin-engine --target ${{ matrix.target }}
      - name: build hook
        working-directory: armin-core
        run: cargo build --release -p armin-hook --target ${{ matrix.target }}
      - name: package engine
        run: |
          dir="${{ matrix.archive }}"
          mkdir "$dir"
          cp "armin-core/target/${{ matrix.target }}/release/armin-engine" "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - name: stage hook binary for the claude plugin
        run: |
          mkdir -p claude-plugin-bin
          cp "armin-core/target/${{ matrix.target }}/release/armin-hook" \
             "claude-plugin-bin/armin-hook-${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: armin-hook-${{ matrix.platform }}
          path: claude-plugin-bin/armin-hook-${{ matrix.platform }}
      - name: upload engine to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256

  plugin:
    name: Package claude plugin
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: armin-hook-*
          merge-multiple: true
          path: claude-plugin/bin
      - name: make binaries executable
        working-directory: claude-plugin
        run: |
          chmod +x bin/armin-hook bin/armin-hook-*
          ls -la bin/
      - name: set plugin version from tag
        run: |
          node -e "
            const fs = require('fs');
            const p = 'claude-plugin/.claude-plugin/plugin.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf-8'));
            m.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          "
        env:
          VERSION: ${{ github.ref_name }}
      - name: package plugin archive
        run: |
          cd claude-plugin
          zip -qr "../armin-claude-plugin-${GITHUB_REF_NAME}.zip" .
          cd ..
          shasum -a 256 "armin-claude-plugin-${GITHUB_REF_NAME}.zip" \
            > "armin-claude-plugin-${GITHUB_REF_NAME}.zip.sha256"
      - name: upload plugin archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            armin-claude-plugin-*.zip
            armin-claude-plugin-*.zip.sha256
      - name: pin marketplace entry to this release
        run: |
          SHA=$(cut -d' ' -f1 "armin-claude-plugin-${GITHUB_REF_NAME}.zip.sha256")
          node -e "
            const fs = require('fs');
            const mk = '.claude-plugin/marketplace.json';
            const cat = JSON.parse(fs.readFileSync(mk, 'utf-8'));
            const entry = cat.plugins.find((p) => p.name === 'armin');
            entry.version = process.env.GITHUB_REF_NAME.slice(1);
            entry.source.url = 'https://github.com/bastian-seifert/armin/releases/download/' + process.env.GITHUB_REF_NAME + '/armin-claude-plugin-' + process.env.GITHUB_REF_NAME + '.zip';
            entry.source.sha256 = '$SHA';
            fs.writeFileSync(mk, JSON.stringify(cat, null, 2) + '\n');
          "
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: commit pinned catalog back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add .claude-plugin/marketplace.json
          if git diff --cached --quiet; then
            echo "marketplace already pinned"
          else
            git commit -m "chore(release): pin armin claude-plugin catalog to ${GITHUB_REF_NAME} [skip ci]"
            git push origin main
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

  npm:
    name: Publish npm package (trusted publishing)
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read
      id-token: write   # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: skip if this version is already on npm
        id: gate
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "armin-opencode@$VERSION" version >/dev/null 2>&1; then
            echo "armin-opencode@$VERSION already published — skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: stage package (version from tag, plugin file)
        if: steps.gate.outputs.publish == 'true'
        run: |
          mkdir -p npm/plugins
          cp .opencode/plugins/armin.ts npm/plugins/armin.ts
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('npm/package.json','utf-8'));p.version=process.env.GITHUB_REF_NAME.slice(1);fs.writeFileSync('npm/package.json',JSON.stringify(p,null,2)+'\n')"
      - name: publish (OIDC trusted publisher — no token)
        if: steps.gate.outputs.publish == 'true'
        working-directory: npm
        run: npm publish --access public --provenance
