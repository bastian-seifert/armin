name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: armin-core
      - name: cargo test
        working-directory: armin-core
        run: cargo test --workspace
      - name: cargo clippy
        working-directory: armin-core
        run: cargo clippy --workspace -- -D warnings

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  plugin:
    name: Plugin (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun install (types)
        working-directory: .opencode
        run: bun install
      - name: tsc
        run: |
          cd .opencode
          bunx tsc --noEmit --strict --types bun --moduleResolution bundler \
            --module es2022 --target es2022 --skipLibCheck plugins/armin.ts
