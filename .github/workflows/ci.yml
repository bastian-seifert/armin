name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: armin-core
      - name: cargo test
        working-directory: armin-core
        run: cargo test --workspace
      - name: cargo clippy
        working-directory: armin-core
        run: cargo clippy --workspace -- -D warnings

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  plugin:
    name: Plugin (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun install (types)
        working-directory: .opencode
        run: bun install
      - name: tsc
        run: |
          cd .opencode
          bunx tsc --noEmit --strict --types bun --moduleResolution bundler \
            --module es2022 --target es2022 --skipLibCheck plugins/armin.ts

  claude-plugin:
    name: Claude plugin (catalog consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifests parse, names agree, hooks map to armin-hook subcommands
        run: |
          node -e "
            const fs = require('fs');
            const read = (p) => JSON.parse(fs.readFileSync(p, 'utf-8'));
            const mk = read('.claude-plugin/marketplace.json');
            const pl = read('claude-plugin/.claude-plugin/plugin.json');
            const hk = read('claude-plugin/hooks/hooks.json');
            const entry = mk.plugins.find((p) => p.name === pl.name);
            if (!entry) throw new Error('marketplace has no entry named ' + pl.name);
            const subs = ['ensure', 'session-start', 'user-prompt-submit', 'post-tool-use', 'post-compact', 'session-end'];
            for (const [event, groups] of Object.entries(hk.hooks)) {
              for (const g of groups) for (const h of g.hooks) {
                if (h.command !== '\${CLAUDE_PLUGIN_ROOT}/bin/armin-hook') throw new Error(event + ': unexpected command ' + h.command);
                if (!subs.includes(h.args?.[0])) throw new Error(event + ': unknown subcommand ' + h.args?.[0]);
              }
            }
            console.log('ok:', Object.keys(hk.hooks).join(', '));
          "
          test -x claude-plugin/bin/armin-hook
