[package]
name = "armin-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "armin-server"
path = "src/main.rs"

[dependencies]
armin-graph      = { path = "../graph" }
armin-extraction = { path = "../extraction" }
armin-grounding  = { path = "../grounding" }
armin-ingest     = { path = "../ingest" }
armin-http       = { path = "../http" }
axum             = { version = "0.8", features = ["ws", "macros"] }
tower-http       = { version = "0.6", features = ["cors"] }
rmcp             = { version = "2.0.0", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
clap.workspace   = true
tokio.workspace  = true
serde.workspace  = true
serde_json.workspace = true
uuid.workspace   = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
